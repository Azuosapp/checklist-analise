# Traefik do checklist-analise em produção — configuração dinâmica (file provider).
#
# Onde vai: https://coolify.grupoazuos.com.br → Servers → <servidor> → Proxy → Dynamic Configurations → `checklist-analise.yaml`.
# O Traefik relê o arquivo sozinho; não precisa reiniciar o proxy.
#
# Este arquivo SUBSTITUI as Container Labels do app. Com os dois ativos, o mesmo Host fica com um
# router `@docker` e outro `@file`, e o Traefik escolhe um deles sem avisar. Ao aplicar, apague as
# labels `traefik.*` do app no Coolify.
#
# Tudo aqui tem o prefixo `checklist-analise-` e é definido neste arquivo: nada de middleware de outro app ou
# global (ver `server/configuration/apps/coolify/README.md`, "Labels: cada app com as suas").
#
# `checklist-analise:3009` em `services` é o nome do container na rede do proxy e a `API_PORT` com que ele sobe
# em produção. Se o boot do app mostrar outra porta, é esta linha que muda — porta errada dá `Bad Gateway`.
http:
  routers:
    checklist-analise-http:
      entryPoints: [http]
      rule: Host(`checklist-analise.grupoazuos.com.br`)
      middlewares: [checklist-analise-redirect]
      service: checklist-analise
    checklist-analise:
      entryPoints: [https]
      rule: Host(`checklist-analise.grupoazuos.com.br`)
      middlewares: [checklist-analise-headers, checklist-analise-rate, checklist-analise-auth, checklist-analise-strip-cookie, checklist-analise-gzip]
      service: checklist-analise
      tls:
        certResolver: letsencrypt

  middlewares:
    checklist-analise-redirect:
      redirectScheme:
        scheme: https
        permanent: true
    checklist-analise-headers:
      headers:
        contentTypeNosniff: true
        frameDeny: true
        stsIncludeSubdomains: true
        stsSeconds: 31536000
    checklist-analise-rate:
      rateLimit:
        average: 200
        burst: 100
    # A identidade vem do login do admin-console do mesmo servidor; o app só lê os `x-forwarded-user-*`.
    checklist-analise-auth:
      forwardAuth:
        address: http://admin-console:3000/api/auth/verify
        authResponseHeaders:
          - x-forwarded-user-id
          - x-forwarded-user-email
          - x-forwarded-user-name
          - x-forwarded-user-role
        addAuthCookiesToResponse:
          - azuos_homo_access_token
          - azuos_homo_refresh_token
    # O cookie de sessão já cumpriu o papel no forwardAuth; o app não recebe o token.
    checklist-analise-strip-cookie:
      headers:
        customRequestHeaders:
          Cookie: ""
    # SSE fica fora: comprimido, o evento só chega ao navegador quando o buffer enche.
    checklist-analise-gzip:
      compress:
        excludedContentTypes:
          - text/event-stream

  services:
    checklist-analise:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://checklist-analise:3009
